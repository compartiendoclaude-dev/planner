<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A0A3E">
<title>OPS Watch</title>
<link rel="manifest" href="watch-manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#1A0A3E;
  --mint:#34D399;--amber:#FBBF24;--sky:#60A5FA;--rose:#FB7185;
  --accent:#9B7FFF;--accent2:#C4B5FD;
  --text:#F0EDFF;--muted:#8B7FC8;--surface:rgba(255,255,255,.07);
}
html,body{
  width:396px;height:396px;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.face{
  position:relative;width:396px;height:396px;border-radius:50%;overflow:hidden;
  background:radial-gradient(ellipse 80% 70% at 50% 30%,#2D1B6B 0%,#1A0A3E 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
/* TIME */
.w-time{
  font-size:64px;font-weight:800;letter-spacing:-3px;
  line-height:1;color:var(--text);text-align:center;margin-bottom:2px;
}
.w-date{
  font-size:12px;color:var(--muted);font-weight:500;
  text-align:center;letter-spacing:.3px;margin-bottom:14px;
  text-transform:capitalize;
}
/* PROGRESS RING */
.ring-wrap{position:relative;width:108px;height:108px;margin-bottom:12px;}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(155,127,255,.15);stroke-width:7;}
.ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .7s ease,stroke .4s ease;}
.ring-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-pct{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
.ring-label{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
/* STAT ROW */
.stat-row{display:flex;gap:7px;align-items:center;justify-content:center;}
.stat-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--surface);border-radius:99px;
  padding:5px 11px;border:1px solid rgba(255,255,255,.07);
}
.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.stat-num{font-size:15px;font-weight:800;line-height:1;}
.stat-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
/* NEXT TASK */
.next-task{
  margin-top:11px;
  background:rgba(155,127,255,.08);border:1px solid rgba(155,127,255,.16);
  border-radius:12px;padding:6px 14px;max-width:230px;text-align:center;
}
.next-task-label{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.next-task-name{font-size:12px;font-weight:600;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.next-task-time{font-size:10px;color:var(--sky);margin-top:1px;}
/* LOADING */
.spinner{width:28px;height:28px;border:2.5px solid rgba(155,127,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:11px;color:var(--muted);font-weight:500;margin-top:10px;}
/* LOGIN MSG */
.login-msg{text-align:center;padding:30px;}
.login-icon{font-size:32px;margin-bottom:10px;}
.login-title{font-size:14px;font-weight:700;margin-bottom:5px;}
.login-sub{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
.retry-btn{background:var(--accent);border:none;color:#fff;padding:8px 20px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="face" id="face">

  <!-- LOADING -->
  <div id="state-loading" style="display:flex;flex-direction:column;align-items:center">
    <div class="spinner"></div>
    <div class="loading-text">Cargando…</div>
  </div>

  <!-- NOT LOGGED IN -->
  <div id="state-login" style="display:none">
    <div class="login-msg">
      <div class="login-icon">🔐</div>
      <div class="login-title">Inicia sesión</div>
      <div class="login-sub">Abre el planner en tu teléfono e inicia sesión primero</div>
      <button class="retry-btn" onclick="init()">Reintentar</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="state-dash" style="display:none;flex-direction:column;align-items:center;width:100%">

    <div class="w-time" id="w-time">00:00</div>
    <div class="w-date" id="w-date">—</div>

    <!-- Ring -->
    <div class="ring-wrap">
      <svg viewBox="0 0 108 108" width="108" height="108">
        <circle class="ring-bg" cx="54" cy="54" r="47"/>
        <circle class="ring-fill" id="ring-fill" cx="54" cy="54" r="47"
          stroke="#34D399" stroke-dasharray="295.3" stroke-dashoffset="295.3"/>
      </svg>
      <div class="ring-center">
        <div class="ring-pct" id="ring-pct">0%</div>
        <div class="ring-label">Cumplimiento</div>
      </div>
    </div>

    <!-- Stats: Completadas / Total / En curso -->
    <div class="stat-row">
      <div class="stat-pill">
        <div class="stat-dot" style="background:var(--mint)"></div>
        <div>
          <div class="stat-num" id="s-done" style="color:var(--mint)">0</div>
          <div class="stat-lbl">Hechas</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-dot" style="background:var(--accent2)"></div>
        <div>
          <div class="stat-num" id="s-total" style="color:var(--accent2)">0</div>
          <div class="stat-lbl">Total</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-dot" style="background:var(--sky)"></div>
        <div>
          <div class="stat-num" id="s-prog" style="color:var(--sky)">0</div>
          <div class="stat-lbl">En curso</div>
        </div>
      </div>
    </div>

    <!-- Next task with time -->
    <div class="next-task" id="next-task" style="display:none">
      <div class="next-task-label">Próxima tarea</div>
      <div class="next-task-name" id="next-name">—</div>
      <div class="next-task-time" id="next-time">—</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://ylsouysqlkzlfwkbvitt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsc291eXNxbGt6bGZ3a2J2aXR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTc0NDQsImV4cCI6MjA5NTQ3MzQ0NH0.zT6IpElm6KgVduSMDpsSc1Y7I0zkoqYvX9Bo4Wyrkhw';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

// ── CLOCK ──
function tick(){
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('w-time').textContent=`${h}:${m}`;
  document.getElementById('w-date').textContent=
    n.toLocaleDateString('es-SV',{weekday:'short',day:'numeric',month:'short'});
}
setInterval(tick,1000);tick();

// ── HELPERS ──
function todayStr(){return new Date().toISOString().split('T')[0];}
function todayDow(){return(new Date().getDay()+6)%7;}
function getStatus(t,inst){
  if(!t.recurrence||t.recurrence==='once')return t.status;
  return inst[t.task_id||t.id]?.status||'pending';
}

// ── FILTER TODAY ──
function todayTasks(tasks){
  const td=todayStr(),dw=todayDow();
  return tasks.filter(t=>{
    if(td<(t.created_at||'').slice(0,10))return false;
    const r=t.recurrence||'once';
    if(r==='once')     return t.specific_date===td||(t.day_of_week===dw&&!t.specific_date);
    if(r==='daily')    return dw<5;
    if(r==='weekly')   return true;
    if(r==='specific_day') return(t.recurrence_day??t.day_of_week)===dw;
    if(r==='monthly'&&t.specific_date)
      return new Date(t.specific_date+'T12:00:00').getDate()===new Date().getDate();
    return false;
  });
}

// ── RENDER ──
function render(tasks,inst){
  const today=todayTasks(tasks);
  const total=today.length;
  const done=today.filter(t=>getStatus(t,inst)==='completed').length;
  const prog=today.filter(t=>getStatus(t,inst)==='in_progress').length;
  const pct=total>0?Math.round(done/total*100):0;

  document.getElementById('s-done').textContent=done;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-prog').textContent=prog;
  document.getElementById('ring-pct').textContent=pct+'%';

  // Ring stroke offset (circumference = 2π×47 ≈ 295.3)
  const circ=295.3;
  const rf=document.getElementById('ring-fill');
  rf.style.strokeDashoffset=circ-(pct/100*circ);
  rf.style.stroke=pct>=80?'#34D399':pct>=50?'#9B7FFF':pct>=20?'#FBBF24':'#FB7185';

  // Next upcoming task with time
  const now=new Date().toTimeString().slice(0,5);
  const next=today
    .filter(t=>t.time_slot&&getStatus(t,inst)!=='completed'&&t.time_slot.slice(0,5)>=now)
    .sort((a,b)=>a.time_slot.localeCompare(b.time_slot))[0];

  const nEl=document.getElementById('next-task');
  if(next){
    document.getElementById('next-name').textContent=next.title;
    document.getElementById('next-time').textContent='⏰ '+next.time_slot.slice(0,5);
    nEl.style.display='block';
  }else{
    nEl.style.display='none';
  }

  // Show dashboard
  document.getElementById('state-loading').style.display='none';
  document.getElementById('state-login').style.display='none';
  document.getElementById('state-dash').style.display='flex';
}

// ── LOAD ──
async function init(){
  document.getElementById('state-loading').style.display='flex';
  document.getElementById('state-login').style.display='none';
  document.getElementById('state-dash').style.display='none';

  const{data:{session}}=await supa.auth.getSession();
  if(!session){
    document.getElementById('state-loading').style.display='none';
    document.getElementById('state-login').style.display='block';
    return;
  }

  const td=todayStr();
  const[tRes,iRes]=await Promise.all([
    supa.from('planner_tasks').select('id,title,status,recurrence,recurrence_day,day_of_week,specific_date,time_slot,created_at'),
    supa.from('planner_task_instances').select('task_id,status').eq('instance_date',td),
  ]);

  const inst={};
  (iRes.data||[]).forEach(i=>inst[i.task_id]=i);
  render(tRes.data||[],inst);
}

// Auto-refresh every 2 min
setInterval(init,120000);

if('serviceWorker' in navigator)
  navigator.serviceWorker.register('/watch-sw.js').catch(()=>{});

init();
</script>
</body>
</html>

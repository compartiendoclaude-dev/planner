<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner — Operaciones</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #0B1120;
  --bg-surface: #141E32;
  --bg-card: #1C2A42;
  --bg-hover: #243352;
  --bg-active: #2D3F61;
  --accent: #7C3AED;
  --accent-light: #9D6FEF;
  --accent-glow: rgba(124,58,237,0.25);
  --cyan: #06B6D4;
  --cyan-light: #22D3EE;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text-primary: #F0F4FF;
  --text-secondary: #8B9CBD;
  --text-muted: #5A6A88;
  --s-high: #F43F5E;
  --s-high-bg: rgba(244,63,94,0.15);
  --s-medium: #F59E0B;
  --s-medium-bg: rgba(245,158,11,0.15);
  --s-low: #10B981;
  --s-low-bg: rgba(16,185,129,0.15);
  --st-pending: #8B9CBD;
  --st-progress: #06B6D4;
  --st-done: #10B981;
  --st-blocked: #F43F5E;
  --sidebar-w: 220px;
  --radius: 10px;
  --radius-sm: 6px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg-base); color:var(--text-primary); min-height:100vh; display:flex; overflow:hidden; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top:0; left:0; bottom:0; z-index:100;
}
.sidebar-logo {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.logo-mark { display:flex; align-items:center; gap:10px; }
.logo-icon {
  width:34px; height:34px; border-radius:9px;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
}
.logo-text { font-size:14px; font-weight:700; letter-spacing:-.3px; }
.logo-sub { font-size:11px; color:var(--text-muted); font-weight:400; }

.sidebar-nav { padding:12px 10px; flex:1; overflow-y:auto; }
.nav-section-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; padding:8px 8px 4px; }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; font-size:13px; font-weight:500; color:var(--text-secondary);
  transition: all .15s; margin-bottom:2px; user-select:none;
}
.nav-item:hover { background:var(--bg-hover); color:var(--text-primary); }
.nav-item.active { background:var(--accent-glow); color:var(--accent-light); border:1px solid rgba(124,58,237,.3); }
.nav-item .icon { font-size:16px; width:20px; text-align:center; }
.nav-item .badge {
  margin-left:auto; background:var(--accent); color:#fff;
  font-size:10px; font-weight:700; padding:2px 6px; border-radius:99px;
  min-width:18px; text-align:center;
}

.sidebar-footer { padding:14px 10px; border-top:1px solid var(--border); }
.week-label { font-size:11px; color:var(--text-muted); text-align:center; margin-bottom:8px; }
.week-nav { display:flex; align-items:center; justify-content:space-between; }
.week-btn {
  width:28px; height:28px; border-radius:6px; border:1px solid var(--border-strong);
  background:transparent; color:var(--text-secondary); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; transition: all .15s;
}
.week-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
#week-display { font-size:12px; font-weight:600; color:var(--text-primary); }

/* ── MAIN ── */
#main {
  margin-left: var(--sidebar-w);
  flex:1; display:flex; flex-direction:column;
  overflow:hidden; height:100vh;
}

/* ── TOPBAR ── */
#topbar {
  background:var(--bg-surface); border-bottom:1px solid var(--border);
  padding:0 24px; height:60px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:50;
}
.topbar-title { font-size:16px; font-weight:700; flex:1; }
.topbar-subtitle { font-size:12px; color:var(--text-muted); font-weight:400; margin-left:8px; }
.search-wrap { position:relative; }
.search-wrap input {
  background:var(--bg-card); border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); padding:8px 12px 8px 34px;
  font-size:13px; color:var(--text-primary); width:220px; outline:none;
  font-family:'Inter',sans-serif; transition: border .15s;
}
.search-wrap input:focus { border-color:var(--accent); }
.search-wrap::before { content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.5; }
.filter-pills { display:flex; gap:8px; align-items:center; }
.filter-pill {
  padding:6px 12px; border-radius:99px; font-size:12px; font-weight:500;
  border:1px solid var(--border-strong); background:transparent; color:var(--text-secondary);
  cursor:pointer; transition:all .15s;
}
.filter-pill:hover { background:var(--bg-hover); color:var(--text-primary); }
.filter-pill.active { background:var(--accent-glow); color:var(--accent-light); border-color:rgba(124,58,237,.4); }
.btn-new {
  background: linear-gradient(135deg, var(--accent), #6D28D9);
  color:#fff; border:none; border-radius:var(--radius-sm);
  padding:9px 16px; font-size:13px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; gap:6px;
  transition:opacity .15s; white-space:nowrap;
}
.btn-new:hover { opacity:.88; }

/* ── CONTENT AREA ── */
#content { flex:1; overflow-y:auto; padding:20px 24px; }

/* ── WEEKLY VIEW ── */
.weekly-grid {
  display:grid; grid-template-columns:repeat(7,1fr); gap:10px;
}
.day-col {
  background:var(--bg-surface); border-radius:var(--radius);
  border:1px solid var(--border); min-height:520px; display:flex; flex-direction:column;
  overflow:hidden;
}
.day-header {
  padding:12px 12px 10px; border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.day-name { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-muted); }
.day-number {
  font-size:20px; font-weight:800; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
}
.day-col.today .day-number { background:var(--accent); color:#fff; }
.day-col.today { border-color:rgba(124,58,237,.4); }
.day-tasks { padding:8px; flex:1; display:flex; flex-direction:column; gap:6px; overflow-y:auto; }
.day-add {
  padding:6px; margin:4px; border-radius:6px; border:1px dashed var(--border-strong);
  text-align:center; font-size:11px; color:var(--text-muted); cursor:pointer; transition:all .15s;
}
.day-add:hover { border-color:var(--accent); color:var(--accent-light); background:var(--accent-glow); }

/* ── TASK CARD ── */
.task-card {
  border-radius:8px; padding:9px 10px; cursor:pointer;
  border-left:3px solid transparent; transition:all .15s;
  background:var(--bg-card); position:relative;
  border: 1px solid var(--border);
}
.task-card:hover { background:var(--bg-hover); transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,.3); }
.task-card.priority-high { border-left-color:var(--s-high); }
.task-card.priority-medium { border-left-color:var(--s-medium); }
.task-card.priority-low { border-left-color:var(--s-low); }
.task-card.status-completed { opacity:.55; }
.task-card.status-blocked { border-left-color:var(--st-blocked); }
.task-title { font-size:12px; font-weight:600; line-height:1.35; margin-bottom:5px; }
.task-time { font-size:10px; color:var(--cyan); margin-bottom:4px; }
.task-meta { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.task-avatars { display:flex; }
.task-avatar {
  width:18px; height:18px; border-radius:50%; font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:1.5px solid var(--bg-card);
  margin-left:-4px; flex-shrink:0;
}
.task-avatar:first-child { margin-left:0; }
.status-dot {
  width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-left:auto;
}
.status-dot.pending { background:var(--st-pending); }
.status-dot.in_progress { background:var(--st-progress); }
.status-dot.completed { background:var(--st-done); }
.status-dot.blocked { background:var(--st-blocked); }

/* ── DAILY VIEW ── */
.daily-timeline { display:flex; flex-direction:column; gap:0; }
.time-slot-row { display:flex; gap:16px; min-height:60px; }
.time-label { width:64px; padding-top:8px; font-size:11px; color:var(--text-muted); text-align:right; flex-shrink:0; }
.time-line { width:1px; background:var(--border); position:relative; flex-shrink:0; }
.time-line::before { content:''; position:absolute; left:-3px; top:12px; width:7px; height:7px; border-radius:50%; background:var(--border-strong); }
.time-tasks { flex:1; padding:6px 0 6px 16px; display:flex; flex-direction:column; gap:5px; }
.daily-task-card {
  background:var(--bg-card); border-radius:8px; padding:10px 14px;
  border-left:3px solid var(--accent); cursor:pointer; transition:all .15s;
  border:1px solid var(--border);
}
.daily-task-card:hover { background:var(--bg-hover); }
.daily-task-card.priority-high { border-left-color:var(--s-high); }
.daily-task-card.priority-medium { border-left-color:var(--s-medium); }
.daily-task-card.priority-low { border-left-color:var(--s-low); }
.dt-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.dt-title { font-size:13px; font-weight:600; flex:1; }
.dt-time { font-size:11px; color:var(--cyan); font-weight:500; }
.dt-desc { font-size:12px; color:var(--text-secondary); line-height:1.4; }
.dt-meta { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }

/* ── LIST VIEW ── */
.list-table { width:100%; border-collapse:collapse; }
.list-table th {
  text-align:left; font-size:11px; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:.6px; padding:10px 14px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
.list-table td {
  padding:12px 14px; border-bottom:1px solid var(--border);
  font-size:13px; vertical-align:middle;
}
.list-table tr:hover td { background:var(--bg-hover); cursor:pointer; }
.list-row-title { font-weight:600; }
.list-row-desc { font-size:11px; color:var(--text-secondary); margin-top:2px; }

/* ── KANBAN ── */
.kanban-board { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:start; }
.kanban-col { background:var(--bg-surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; }
.kanban-col-header {
  padding:14px 16px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.kanban-col-title { font-size:13px; font-weight:700; }
.kanban-col-count {
  margin-left:auto; font-size:11px; font-weight:600; color:var(--text-muted);
  background:var(--bg-card); padding:2px 8px; border-radius:99px;
}
.kanban-cards { padding:10px; display:flex; flex-direction:column; gap:8px; min-height:80px; }
.kanban-card {
  background:var(--bg-card); border-radius:8px; padding:11px 12px;
  border:1px solid var(--border); cursor:pointer; transition:all .15s;
}
.kanban-card:hover { background:var(--bg-hover); transform:translateY(-1px); }
.kanban-card-title { font-size:13px; font-weight:600; margin-bottom:6px; }
.kanban-card-desc { font-size:11px; color:var(--text-secondary); margin-bottom:8px; line-height:1.4; }
.kanban-card-footer { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* ── BADGES ── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:99px; font-size:11px; font-weight:600;
}
.badge-priority-high { background:var(--s-high-bg); color:var(--s-high); }
.badge-priority-medium { background:var(--s-medium-bg); color:var(--s-medium); }
.badge-priority-low { background:var(--s-low-bg); color:var(--s-low); }
.badge-status-pending { background:rgba(139,156,189,.15); color:var(--st-pending); }
.badge-status-in_progress { background:rgba(6,182,212,.15); color:var(--st-progress); }
.badge-status-completed { background:rgba(16,185,129,.15); color:var(--st-done); }
.badge-status-blocked { background:rgba(244,63,94,.15); color:var(--st-blocked); }
.badge-tag { background:rgba(124,58,237,.15); color:var(--accent-light); }
.badge-recurrence { background:rgba(6,182,212,.1); color:var(--cyan); }

/* ── MODAL ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:999;
  display:flex; align-items:center; justify-content:center; padding:20px;
  backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal {
  background:var(--bg-surface); border-radius:14px; border:1px solid var(--border-strong);
  width:100%; max-width:680px; max-height:90vh; overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.6); transform:translateY(20px); transition:transform .2s;
}
.modal-overlay.open .modal { transform:translateY(0); }
.modal-header {
  padding:20px 24px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.modal-title { font-size:16px; font-weight:700; flex:1; }
.modal-close { background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; padding:2px 6px; border-radius:4px; }
.modal-close:hover { color:var(--text-primary); background:var(--bg-hover); }
.modal-body { padding:24px; display:flex; flex-direction:column; gap:18px; }
.modal-footer { padding:16px 24px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }

/* ── FORM ── */
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.form-label { font-size:12px; font-weight:600; color:var(--text-secondary); }
.form-label span { color:var(--text-muted); font-weight:400; }
.form-input, .form-select, .form-textarea {
  background:var(--bg-card); border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); padding:9px 12px; font-size:13px;
  color:var(--text-primary); font-family:'Inter',sans-serif; outline:none;
  transition:border .15s; width:100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
.form-textarea { min-height:80px; resize:vertical; }
.form-select option { background:var(--bg-surface); }

/* Member checkboxes */
.member-list { display:flex; flex-wrap:wrap; gap:8px; }
.member-check {
  display:flex; align-items:center; gap:7px; padding:7px 12px;
  border-radius:99px; border:1px solid var(--border-strong); cursor:pointer;
  transition:all .15s; font-size:12px; font-weight:500;
}
.member-check input { display:none; }
.member-check.checked { border-color:var(--accent); background:var(--accent-glow); color:var(--accent-light); }
.member-check-avatar { width:22px; height:22px; border-radius:50%; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }

/* Tag input */
.tag-list { display:flex; flex-wrap:wrap; gap:6px; }
.tag-btn {
  padding:4px 10px; border-radius:99px; font-size:11px; font-weight:600;
  border:1px solid var(--border-strong); cursor:pointer; transition:all .15s;
  background:transparent; color:var(--text-secondary);
}
.tag-btn.selected { background:rgba(124,58,237,.2); border-color:rgba(124,58,237,.5); color:var(--accent-light); }

/* Buttons */
.btn { padding:9px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; font-family:'Inter',sans-serif; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-light); }
.btn-ghost { background:transparent; color:var(--text-secondary); border:1px solid var(--border-strong); }
.btn-ghost:hover { background:var(--bg-hover); color:var(--text-primary); }
.btn-danger { background:rgba(244,63,94,.15); color:var(--s-high); border:1px solid rgba(244,63,94,.3); }
.btn-danger:hover { background:rgba(244,63,94,.25); }

/* ── STATS ROW ── */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.stat-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.stat-number { font-size:28px; font-weight:800; line-height:1; margin-bottom:4px; }
.stat-label { font-size:12px; color:var(--text-muted); font-weight:500; }
.stat-card.s-high .stat-number { color:var(--s-high); }
.stat-card.s-cyan .stat-number { color:var(--cyan); }
.stat-card.s-green .stat-number { color:var(--s-low); }
.stat-card.s-purple .stat-number { color:var(--accent-light); }

/* ── FILTERS BAR ── */
.filters-bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.filter-select {
  background:var(--bg-card); border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:7px 12px; font-size:12px; color:var(--text-secondary); outline:none; cursor:pointer;
  font-family:'Inter',sans-serif;
}
.filter-select:focus { border-color:var(--accent); }
.filter-select option { background:var(--bg-surface); }

/* ── EMPTY ── */
.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; opacity:.5; }
.empty-state p { font-size:14px; margin-bottom:16px; }

/* ── TOAST ── */
.toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
.toast {
  background:var(--bg-card); border:1px solid var(--border-strong); border-radius:var(--radius);
  padding:12px 18px; font-size:13px; font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.4); min-width:240px;
  animation: slideIn .25s ease; display:flex; align-items:center; gap:10px;
}
.toast.success { border-left:3px solid var(--s-low); }
.toast.error { border-left:3px solid var(--s-high); }
@keyframes slideIn { from { transform:translateX(60px); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* ── LOADING ── */
.loading { display:flex; align-items:center; justify-content:center; padding:60px; gap:12px; color:var(--text-muted); }
.spinner { width:24px; height:24px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:99px; }

/* ── MEMBER FILTER ── */
.member-filter-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.member-filter-btn {
  display:flex; align-items:center; gap:6px; padding:5px 12px;
  border-radius:99px; border:1px solid var(--border-strong); cursor:pointer;
  font-size:12px; font-weight:500; color:var(--text-secondary); background:transparent;
  transition:all .15s;
}
.member-filter-btn.active { background:var(--accent-glow); border-color:rgba(124,58,237,.4); color:var(--accent-light); }
.mfb-avatar { width:20px; height:20px; border-radius:50%; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }

/* ── RECURRENCE INDICATOR ── */
.recurrence-icon { font-size:10px; color:var(--cyan); margin-left:auto; }

/* DAY SELECT GRID */
.day-select-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.day-select-btn {
  padding:7px 0; border-radius:6px; border:1px solid var(--border-strong);
  background:transparent; color:var(--text-secondary); font-size:11px; font-weight:600;
  cursor:pointer; text-align:center; transition:all .15s;
}
.day-select-btn.selected { background:var(--accent-glow); border-color:rgba(124,58,237,.5); color:var(--accent-light); }

/* Settings panel */
.settings-section { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); padding:20px; margin-bottom:16px; }
.settings-title { font-size:14px; font-weight:700; margin-bottom:14px; }
.member-edit-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.member-color-dot { width:24px; height:24px; border-radius:50%; border:2px solid var(--border-strong); cursor:pointer; }

@media (max-width:1200px) {

function getWeekStart(d) {

function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }

// ── RECURRENCE EXPANSION ──
function expandTasks(rawTasks, weekStart, weekEnd) {
  const expanded = [];
  const today = new Date(); today.setHours(0,0,0,0);

  for (const t of rawTasks) {
    if (t.recurrence === 'once' || !t.recurrence) {
      expanded.push(t);
      continue;
    }
    if (t.recurrence === 'daily') {
      // One per day of week
      for (let i=0; i<7; i++) {
        const d = addDays(weekStart, i);
        if (d >= new Date(weekStart) && d <= new Date(weekEnd)) {
          expanded.push({...t, _virtual:true, _date: fmtDate(d), specific_date: fmtDate(d), day_of_week:i});
        }
      }
      continue;
    }
    if (t.recurrence === 'weekly') {
      // Same day every week – use stored day_of_week or specific_date day
      const dow = t.day_of_week !== null && t.day_of_week !== undefined ? t.day_of_week : (t.specific_date ? new Date(t.specific_date+'T12:00:00').getDay() : 0);
      const adjusted = dow === 0 ? 6 : dow - 1;
      const d = addDays(weekStart, adjusted);
      expanded.push({...t, _virtual:true, specific_date: fmtDate(d)});
      continue;
    }
    if (t.recurrence === 'specific_day') {
      const dow = t.recurrence_day !== null ? t.recurrence_day : t.day_of_week;
      const adjusted = dow === 0 ? 6 : dow - 1;
      const d = addDays(weekStart, adjusted);
      if (d >= new Date(weekStart) && d <= new Date(weekEnd)) {
        expanded.push({...t, _virtual:true, specific_date: fmtDate(d)});
      }
      continue;
    }
    if (t.recurrence === 'monthly') {
      // Show on its stored date if it falls in week
      expanded.push(t);
      continue;
    }
    expanded.push(t);
  }
  return expanded;
}

// ── FILTER TASKS ──
function filteredTasks(list) {
  return list.filter(t => {
    if (filterMember && !(t.assigned_to||[]).includes(filterMember)) return false;
    if (filterPriority && t.priority !== filterPriority) return false;
    if (filterTag && !(t.tags||[]).includes(filterTag)) return false;
    if (filterStatus && t.status !== filterStatus) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!t.title.toLowerCase().includes(q) && !(t.description||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ── WEEKLY VIEW ──
function renderWeekly() {
  const weekEnd = addDays(currentWeekStart, 6);
  const expanded = expandTasks(tasks, currentWeekStart, weekEnd);
  const filtered = filteredTasks(expanded);
  const today = new Date(); today.setHours(0,0,0,0);

  let statsHtml = renderStats(filtered);
  let memberFilterHtml = renderMemberFilter();

  let colsHtml = '';
  for (let i=0; i<7; i++) {
    const d = addDays(currentWeekStart, i);
    const dateStr = fmtDate(d);
    const isToday = d.getTime()===today.getTime();
    const dayTasks = filtered.filter(t => {
      if (t.specific_date) return t.specific_date === dateStr;
      if (t.day_of_week !== null && t.day_of_week !== undefined) return t.day_of_week === i;
      return false;
    });

    const cardsHtml = dayTasks.map(t => taskCard(t)).join('');
    colsHtml += `
      <div class="day-col ${isToday?'today':''}">

          <span class="day-name">${dayName(i)}</span>
          <span class="day-number">${d.getDate()}</span>

        <div class="day-add" onclick="openNewTaskDay(${i},'${dateStr}')">＋ Agregar</div>
      </div>`;
  }

  document.getElementById('content').innerHTML = `
    ${statsHtml}
    ${memberFilterHtml}
    <div class="weekly-grid">${colsHtml}</div>`;
}

function taskCard(t) {
  const avatarHtml = (t.assigned_to||[]).slice(0,3).map(id=>{
    const m = getMember(id);
    if (!m) return '';
    return `<div class="task-avatar" style="background:${m.avatar_color}22;color:${m.avatar_color};border-color:${m.avatar_color}33">${initials(m.name)}</div>`;
  }).join('');

  const recIcon = t.recurrence && t.recurrence!=='once' ? `<span class="recurrence-icon">🔄</span>` : '';

  return `<div class="task-card priority-${t.priority} status-${t.status}" onclick="editTask('${t.id}')">
    ${t.time_slot ? `<div class="task-time">⏰ ${t.time_slot.slice(0,5)}</div>` : ''}
    <div class="task-title">${t.title}${recIcon}</div>
    <div class="task-meta">
      <div class="task-avatars">${avatarHtml}</div>
      <span class="status-dot ${t.status}"></span>
    </div>
  </div>`;
}

// ── DAILY VIEW ──
function renderDaily() {
  const dateStr = fmtDate(currentDay);
  const dayOfWeek = (currentDay.getDay()+6)%7; // 0=Mon
  const expanded = expandTasks(tasks, getWeekStart(currentDay), addDays(getWeekStart(currentDay),6));
  const filtered = filteredTasks(expanded).filter(t => {
    if (t.specific_date) return t.specific_date === dateStr;
    if (t.day_of_week !== null && t.day_of_week !== undefined) return t.day_of_week === dayOfWeek;
    return false;
  });

  // Group by hour
  const byHour = {};
  const noTime = [];
  for (const t of filtered) {
    if (t.time_slot) {
      const h = parseInt(t.time_slot.split(':')[0]);
      if (!byHour[h]) byHour[h] = [];
      byHour[h].push(t);
    } else noTime.push(t);
  }

  const dayNav = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <button class="btn btn-ghost" onclick="currentDay=addDays(currentDay,-1);renderView()">‹ Anterior</button>
      <span style="font-size:18px;font-weight:700;">${fmt(currentDay,{weekday:'long',day:'numeric',month:'long'})}</span>
      <button class="btn btn-ghost" onclick="currentDay=addDays(currentDay,1);renderView()">Siguiente ›</button>
      <button class="btn btn-ghost" onclick="currentDay=new Date();renderView()">Hoy</button>
      <button class="btn btn-primary" style="margin-left:auto" onclick="openNewTaskDay(${dayOfWeek},'${dateStr}')">＋ Nueva Tarea</button>
    </div>`;

  if (!filtered.length) {
    document.getElementById('content').innerHTML = dayNav + `
      <div class="empty-state"><div class="empty-icon">🌤</div><p>No hay tareas para este día.</p>
      <button class="btn btn-primary" onclick="openNewTaskDay(${dayOfWeek},'${dateStr}')">Agregar primera tarea</button></div>`;
    return;
  }

  let timelineHtml = '';
  const hours = Array.from({length:13},(_,i)=>i+7);
  for (const h of hours) {
    const htasks = byHour[h]||[];
    const cardsHtml = htasks.map(t => `
      <div class="daily-task-card priority-${t.priority}" onclick="editTask('${t.id}')">
        <div class="dt-header">
          <span class="dt-title">${t.title}</span>
          ${t.time_slot?`<span class="dt-time">${t.time_slot.slice(0,5)}</span>`:''}
          <span class="badge badge-priority-${t.priority}">${PRIORITY_LABEL[t.priority]}</span>
        </div>
        ${t.description?`<div class="dt-desc">${t.description}</div>`:''}
        <div class="dt-meta">
          ${(t.assigned_to||[]).map(id=>{const m=getMember(id);return m?`<span style="font-size:11px;color:${m.avatar_color}">${m.name}</span>`:''}).join('')}
          <span class="badge badge-status-${t.status}" style="margin-left:auto">${STATUS_LABEL[t.status]}</span>
        </div>
      </div>`).join('');

    timelineHtml += `
      <div class="time-slot-row">
        <div class="time-label">${h}:00</div>
        <div class="time-line"></div>
        <div class="time-tasks">${cardsHtml}</div>
      </div>`;
  }

  const noTimeHtml = noTime.length ? `
    <div style="margin-bottom:20px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px;">Sin hora asignada</div>
      ${noTime.map(t=>`
        <div class="daily-task-card priority-${t.priority}" style="margin-bottom:8px" onclick="editTask('${t.id}')">
          <div class="dt-header"><span class="dt-title">${t.title}</span>
            <span class="badge badge-priority-${t.priority}">${PRIORITY_LABEL[t.priority]}</span></div>
          ${t.description?`<div class="dt-desc">${t.description}</div>`:''}
          <div class="dt-meta">
            ${(t.assigned_to||[]).map(id=>{const m=getMember(id);return m?`<span style="font-size:11px;color:${m.avatar_color}">${m.name}</span>`:''}).join('')}
            <span class="badge badge-status-${t.status}" style="margin-left:auto">${STATUS_LABEL[t.status]}</span>
          </div>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('content').innerHTML = dayNav + noTimeHtml + `<div class="daily-timeline">${timelineHtml}</div>`;
}

function renderKanban() {
  const filtered = filteredTasks(tasks);
  const cols = [
    {id:'pending', label:'Pendiente', icon:'⏸', color:'var(--st-pending)'},
    {id:'in_progress', label:'En Progreso', icon:'▶', color:'var(--st-progress)'},
    {id:'completed', label:'Completada', icon:'✓', color:'var(--st-done)'},
    {id:'blocked', label:'Bloqueada', icon:'⛔', color:'var(--st-blocked)'},
  ];

  const colsHtml = cols.map(col => {
    const colTasks = filtered.filter(t=>t.status===col.id);
    const cardsHtml = colTasks.map(t => {
      const avatarHtml = (t.assigned_to||[]).slice(0,3).map(id=>{
        const m=getMember(id);
        if(!m)return '';
        return `<div class="task-avatar" style="background:${m.avatar_color}22;color:${m.avatar_color};border-color:${m.avatar_color}33">${initials(m.name)}</div>`;
      }).join('');
      const tagsHtml = (t.tags||[]).slice(0,2).map(id=>{const g=getTag(id);return g?`<span class="badge badge-tag" style="font-size:10px">${g.name}</span>`:''}).join('');
      return `<div class="kanban-card" onclick="editTask('${t.id}')">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span class="badge badge-priority-${t.priority}" style="font-size:10px">${PRIORITY_LABEL[t.priority]}</span>
          ${t.recurrence&&t.recurrence!=='once'?'<span style="font-size:10px;color:var(--cyan)">🔄</span>':''}
        </div>
        <div class="kanban-card-title">${t.title}</div>
        ${t.description?`<div class="kanban-card-desc">${t.description.slice(0,80)}${t.description.length>80?'…':''}</div>`:''}
        <div class="kanban-card-footer">
          <div class="task-avatars">${avatarHtml}</div>
          ${tagsHtml}
          ${t.specific_date?`<span style="font-size:10px;color:var(--text-muted);margin-left:auto">${fmt(t.specific_date+'T12:00:00',{day:'numeric',month:'short'})}</span>`:''}
        </div>
      </div>`;
    }).join('');

    return `<div class="kanban-col">
      <div class="kanban-col-header">
        <span style="font-size:16px">${col.icon}</span>
        <span class="kanban-col-title" style="color:${col.color}">${col.label}</span>
        <span class="kanban-col-count">${colTasks.length}</span>
      </div>
      <div class="kanban-cards">
        ${cardsHtml||`<div style="text-align:center;padding:20px;font-size:12px;color:var(--text-muted)">Sin tareas</div>`}
        <div class="day-add" onclick="openNewTaskStatus('${col.id}')">＋ Agregar</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    ${renderMemberFilter()}
    <div class="kanban-board">${colsHtml}</div>`;
}

// ── SETTINGS VIEW ──

  const membersHtml = members.map(m=>`
    <div class="member-edit-row">
      <div class="task-avatar" style="width:32px;height:32px;font-size:13px;background:${m.avatar_color}22;color:${m.avatar_color}">${initials(m.name)}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${m.name}</div>
        <div style="font-size:11px;color:var(--text-muted)">${m.role||'Sin rol'}</div>
      </div>
      <span style="font-size:11px;color:var(--text-muted)">${tasks.filter(t=>(t.assigned_to||[]).includes(m.id)).length} tareas</span>
    </div>`).join('');

  const tagsHtml = tags.map(g=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span class="badge badge-tag" style="background:${g.color}22;color:${g.color};border-color:${g.color}33">${g.name}</span>
      <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${tasks.filter(t=>(t.tags||[]).includes(g.id)).length} tareas</span>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div style="max-width:700px;margin:0 auto">
      <div class="settings-section">
        <div class="settings-title">👥 Miembros del Equipo</div>
        ${membersHtml}
        <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
          <input id="new-member-name" class="form-input" placeholder="Nombre del miembro">
          <input id="new-member-role" class="form-input" placeholder="Rol (opcional)">
          <button class="btn btn-primary" onclick="addMember()">Agregar</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">🏷️ Etiquetas</div>
        ${tagsHtml||'<p style="color:var(--text-muted);font-size:13px">Sin etiquetas aún.</p>'}
        <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
          <input id="new-tag-name" class="form-input" placeholder="Nueva etiqueta">
          <input id="new-tag-color" type="color" class="form-input" value="#7C3AED" style="padding:4px">
          <button class="btn btn-primary" onclick="addTag()">Agregar</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">ℹ️ SQL de Configuración</div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Si las tablas no existen, ejecuta esto en Supabase:</p>
        <button class="btn btn-ghost" onclick="document.getElementById('sql-block').style.display=document.getElementById('sql-block').style.display==='none'?'block':'none'">Ver SQL</button>
        <pre id="sql-block" style="display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:11px;color:var(--cyan);overflow-x:auto;margin-top:10px">${getSetupSQL()}</pre>
      </div>
    </div>`;
}

// ── STATS ──
function renderStats(list) {
  const total = list.length;
  const inProgress = list.filter(t=>t.status==='in_progress').length;
  const completed = list.filter(t=>t.status==='completed').length;
  const blocked = list.filter(t=>t.status==='blocked').length;
  return `<div class="stats-row" style="margin-bottom:16px">
    <div class="stat-card s-purple"><div class="stat-number">${total}</div><div class="stat-label">Total tareas</div></div>
    <div class="stat-card s-cyan"><div class="stat-number">${inProgress}</div><div class="stat-label">En Progreso</div></div>
    <div class="stat-card s-green"><div class="stat-number">${completed}</div><div class="stat-label">Completadas</div></div>
    <div class="stat-card s-high"><div class="stat-number">${blocked}</div><div class="stat-label">Bloqueadas</div></div>
  </div>`;
}

// ── MEMBER FILTER ──
function renderMemberFilter() {
  if (!members.length) return '';
  const btns = members.map(m=>`
    <button class="member-filter-btn ${filterMember===m.id?'active':''}" onclick="filterMember=filterMember==='${m.id}'?null:'${m.id}';renderView()">
      <div class="mfb-avatar" style="background:${m.avatar_color}22;color:${m.avatar_color}">${initials(m.name)}</div>
      ${m.name.split(' ')[0]}
    </button>`).join('');
  return `<div class="member-filter-row" style="margin-bottom:14px">
    <span style="font-size:11px;color:var(--text-muted);font-weight:600">Filtrar:</span>
    ${btns}
    ${filterMember?`<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="filterMember=null;renderView()">✕ Todos</button>`:''}
  </div>`;
}

function applyFilters() {
  searchQuery = document.getElementById('search-input').value;
  renderView();
}

// ── MODAL ──
let _taskModal = {
  assignedTo: [],
  selectedTags: [],
  dayOfWeek: null,
  recurrenceDay: null,
};

function openNewTask(defaults={}) {
  editingTaskId = null;
  _taskModal = { assignedTo:[], selectedTags:[], dayOfWeek:null, recurrenceDay:null };
  document.getElementById('modal-title').textContent = 'Nueva Tarea';
  document.getElementById('btn-delete').style.display='none';
  renderModalBody({...defaults});
  document.getElementById('task-modal').classList.add('open');
}

function openNewTaskDay(dow, dateStr) {
  openNewTask({ day_of_week:dow, specific_date:dateStr });
}

function openNewTaskStatus(status) {
  openNewTask({ status });
}

function editTask(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;
  editingTaskId = id;
  _taskModal = {
    assignedTo: [...(t.assigned_to||[])],
    selectedTags: [...(t.tags||[])],
    dayOfWeek: t.day_of_week,
    recurrenceDay: t.recurrence_day,
  };
  document.getElementById('modal-title').textContent = 'Editar Tarea';
  document.getElementById('btn-delete').style.display='block';
  renderModalBody(t);
  document.getElementById('task-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('task-modal').classList.remove('open');
  editingTaskId = null;
}

function renderModalBody(t={}) {
  const membersHtml = members.map(m=>`
    <label class="member-check ${_taskModal.assignedTo.includes(m.id)?'checked':''}" onclick="toggleMember('${m.id}',this)">
      <input type="checkbox"><div class="member-check-avatar" style="background:${m.avatar_color}22;color:${m.avatar_color}">${initials(m.name)}</div>${m.name.split(' ')[0]}
    </label>`).join('');

  const tagsHtml = tags.map(g=>`
    <button type="button" class="tag-btn ${_taskModal.selectedTags.includes(g.id)?'selected':''}" onclick="toggleTag('${g.id}',this)">${g.name}</button>`).join('');

  const dayBtns = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((d,i)=>`
    <button type="button" class="day-select-btn ${_taskModal.dayOfWeek===i?'selected':''}" onclick="selectDay(${i},this)">${d}</button>`).join('');

  document.getElementById('modal-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input id="f-title" class="form-input" placeholder="Nombre de la tarea" value="${t.title||''}">
    </div>
    <div class="form-group">
      <label class="form-label">Descripción <span>(opcional)</span></label>
      <textarea id="f-desc" class="form-textarea" placeholder="Describe la tarea...">${t.description||''}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Asignado a</label>
      <div class="member-list">${membersHtml||'<span style="color:var(--text-muted);font-size:12px">Sin miembros — agrégalos en Equipo & Tags</span>'}</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Fecha específica <span>(opcional)</span></label>
        <input id="f-date" class="form-input" type="date" value="${t.specific_date||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Hora <span>(opcional)</span></label>
        <input id="f-time" class="form-input" type="time" value="${t.time_slot?t.time_slot.slice(0,5):''}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Día de la semana</label>
      <div class="day-select-grid">${dayBtns}</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Estado</label>
        <select id="f-status" class="form-select">
          ${Object.entries(STATUS_LABEL).map(([v,l])=>`<option value="${v}" ${(t.status||'pending')===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Prioridad</label>
        <select id="f-priority" class="form-select">
          ${Object.entries(PRIORITY_LABEL).map(([v,l])=>`<option value="${v}" ${(t.priority||'medium')===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Recurrencia</label>
      <select id="f-recurrence" class="form-select" onchange="toggleRecurrenceDay(this.value)">
        ${Object.entries(RECURRENCE_LABEL).map(([v,l])=>`<option value="${v}" ${(t.recurrence||'once')===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="form-group" id="recurrence-day-group" style="${(t.recurrence==='specific_day')?'':'display:none'}">
      <label class="form-label">Día de recurrencia</label>
      <div class="day-select-grid" id="recurrence-day-btns">
        ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((d,i)=>`<button type="button" class="day-select-btn ${_taskModal.recurrenceDay===i?'selected':''}" onclick="selectRecurrenceDay(${i},this)">${d}</button>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Etiquetas</label>
      <div class="tag-list">${tagsHtml||'<span style="color:var(--text-muted);font-size:12px">Sin etiquetas — agrégalas en Equipo & Tags</span>'}</div>
    </div>
    <div class="form-group">
      <label class="form-label">Notas / Comentarios <span>(opcional)</span></label>
      <textarea id="f-notes" class="form-textarea" placeholder="Notas adicionales...">${t.notes||''}</textarea>
    </div>
    ${t.created_at?`<div style="font-size:11px;color:var(--text-muted)">Creado: ${new Date(t.created_at).toLocaleString('es-SV')} · Actualizado: ${new Date(t.updated_at||t.created_at).toLocaleString('es-SV')}</div>`:''}
  `;
}

function toggleMember(id, el) {
  if (_taskModal.assignedTo.includes(id)) {
    _taskModal.assignedTo = _taskModal.assignedTo.filter(x=>x!==id);
    el.classList.remove('checked');
  } else {
    _taskModal.assignedTo.push(id);
    el.classList.add('checked');
  }
}

function toggleTag(id, el) {
  if (_taskModal.selectedTags.includes(id)) {
    _taskModal.selectedTags = _taskModal.selectedTags.filter(x=>x!==id);
    el.classList.remove('selected');
  } else {
    _taskModal.selectedTags.push(id);
    el.classList.add('selected');
  }
}

function selectDay(i, el) {
  if (_taskModal.dayOfWeek === i) {
    _taskModal.dayOfWeek = null;
    el.classList.remove('selected');
  } else {
    _taskModal.dayOfWeek = i;
    document.querySelectorAll('.day-select-grid .day-select-btn').forEach((b,idx) => {
      b.classList.toggle('selected', idx===i);
    });
  }
}

function selectRecurrenceDay(i, el) {
  _taskModal.recurrenceDay = i;
  document.querySelectorAll('#recurrence-day-btns .day-select-btn').forEach((b,idx) => {
    b.classList.toggle('selected', idx===i);
  });
}

function toggleRecurrenceDay(val) {
  document.getElementById('recurrence-day-group').style.display = val==='specific_day'?'':'none';
}

// ── SAVE / DELETE ──
async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { toast('El título es requerido','error'); return; }

  const payload = {
    title,
    description: document.getElementById('f-desc').value.trim()||null,
    assigned_to: _taskModal.assignedTo,
    specific_date: document.getElementById('f-date').value||null,
    time_slot: document.getElementById('f-time').value||null,
    day_of_week: _taskModal.dayOfWeek,
    status: document.getElementById('f-status').value,
    priority: document.getElementById('f-priority').value,
    recurrence: document.getElementById('f-recurrence').value,
    recurrence_day: _taskModal.recurrenceDay,
    tags: _taskModal.selectedTags,
    notes: document.getElementById('f-notes').value.trim()||null,
    updated_at: new Date().toISOString(),
  };

  let res;
  if (editingTaskId) {
    res = await supa.from('planner_tasks').update(payload).eq('id', editingTaskId);
  } else {
    res = await supa.from('planner_tasks').insert(payload);
  }

  if (res.error) { toast('Error: '+res.error.message,'error'); return; }
  toast(editingTaskId?'Tarea actualizada ✓':'Tarea creada ✓','success');
  closeModal();
  await refreshTasks();
  renderView();
}

async function deleteTask() {
  if (!editingTaskId) return;
  if (!confirm('¿Eliminar esta tarea?')) return;
  const { error } = await supa.from('planner_tasks').delete().eq('id', editingTaskId);
  if (error) { toast('Error al eliminar','error'); return; }
  toast('Tarea eliminada','success');
  closeModal();
  await refreshTasks();
  renderView();
}

async function refreshTasks() {
  const { data, error } = await supa.from('planner_tasks').select('*').order('created_at',{ascending:false});
  if (!error) tasks = data||[];
}

// ── SETTINGS ACTIONS ──
async function addMember() {
  const name = document.getElementById('new-member-name').value.trim();
  const role = document.getElementById('new-member-role').value.trim();
  if (!name) { toast('Ingresa el nombre','error'); return; }
  const colors = ['#7C3AED','#06B6D4','#F59E0B','#10B981','#EC4899','#F43F5E','#8B5CF6'];
  const color = colors[members.length % colors.length];
  const { error } = await supa.from('planner_members').insert({name, role:role||null, avatar_color:color});
  if (error) { toast('Error: '+error.message,'error'); return; }
  const { data } = await supa.from('planner_members').select('*').order('name');
  members = data||[];
  toast('Miembro agregado ✓','success');
  renderSettings();
}

async function addTag() {
  const name = document.getElementById('new-tag-name').value.trim();
  const color = document.getElementById('new-tag-color').value;
  if (!name) { toast('Ingresa el nombre de la etiqueta','error'); return; }
  const { error } = await supa.from('planner_tags').insert({name, color});
  if (error) { toast('Error: '+error.message,'error'); return; }
  const { data } = await supa.from('planner_tags').select('*').order('name');
  tags = data||[];
  toast('Etiqueta agregada ✓','success');
  renderSettings();
}

// ── TOAST ──
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✓':'⚠'}</span> ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ── INIT ──
async function init() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div> Conectando con Supabase…</div>';
  updateWeekDisplay();
  const ok = await loadData();
  if (ok) renderView();
}

// Close modal on overlay click
document.getElementById('task-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

init();
</script>
